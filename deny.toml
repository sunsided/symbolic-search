# cargo-deny configuration. Regenerate the full commented reference with `cargo deny init`.

[graph]
all-features = true

[advisories]
# Advisories (vulnerable, unmaintained, yanked) fail by default; ignore entries need a reason.
ignore = [
  # Unmaintained, not vulnerable: a build-time proc-macro helper of oxidd-derive (oxidd 0.13).
  # No release of oxidd drops it yet; remove this entry once one does.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is pulled in by oxidd-derive only; no maintained oxidd release avoids it" },
]

[licenses]
# Permissive licenses plus the weak-copyleft ones (EUPL, MPL) used by sibling projects.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "EUPL-1.2",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The allowlist is shared across projects; not every license appears in every dependency tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allows version-less path dependencies, but only in unpublished (publish = false) crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
