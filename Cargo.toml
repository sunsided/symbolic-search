[package]
name = "symbolic-search"
description = "Symbolic search for SAS+ planning with BDDs: symbolic BFS and Dijkstra, bidirectional search, BDDA*, SymBA* and symbolic abstraction heuristics"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/symbolic-search"
homepage = "https://sunsided.github.io/planning-and-search/crates/symbolic-search/"
readme = "README.md"
keywords = ["planning", "bdd", "symbolic-search", "symba", "decision-diagram"]
categories = ["algorithms", "artificial-intelligence", "science"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[dependencies]
oxidd = { version = "0.13.0", default-features = false, features = ["manager-index", "bcdd", "apply-cache-direct-mapped"] }
sas-plus = { version = "0.2.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1.12.0"
sas-plus = { version = "0.2.1", features = ["fdr", "random"] }

[[bench]]
name = "search"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
