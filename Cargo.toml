[package]
name = "symbolic-search"
description = "Symbolic state-space search with decision diagrams: symbolic BFS, bidirectional search, BDDA* and SymBA*"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/symbolic-search"
readme = "README.md"
keywords = ["planning", "bdd", "symbolic", "search", "sas"]
categories = ["algorithms", "science"]

[dependencies]
oxidd = { version = "0.13.0", default-features = false, features = ["manager-index", "bcdd", "apply-cache-direct-mapped"] }
sas-plus = { version = "0.2.1", default-features = false }

[dev-dependencies]
sas-plus = { version = "0.2.1", features = ["fdr", "random"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
